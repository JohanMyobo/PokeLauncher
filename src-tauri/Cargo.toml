[workspace]
members = [".", "core"]

[package]
name = "pokelauncher"
version = "0.1.0"
description = "Lanceur perso pour les jeux Pokémon Gen 1 à 5"
edition = "2021"
publish = false

[lib]
name = "pokelauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pokelauncher-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
